# Phase-0 spike: THROWAWAY CODE. Not product code; see ../README.md.
[package]
name = "spike_core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# cdylib for Android (libspike_core.so); lib so the bindgen binary and tests can link it.
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
uniffi = { version = "0.32.2", features = ["cli"] }

[profile.release]
# Argon2id timing is only meaningful with optimisations on.
opt-level = 3
lto = true
codegen-units = 1
strip = true
