# Security checks on every push and pull request, and weekly (blueprint §26).
# Actions are pinned by full commit SHA; tools are pinned by version and, where published, by checksum.
name: security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret deleted later is still a leaked secret
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner .

  semgrep:
    name: Semgrep security rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Semgrep 1.178.0 (in a venv; Ubuntu blocks system-wide pip, PEP 668)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "semgrep==1.178.0"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Test the rules themselves
        run: |
          semgrep --test --metrics=off --config .semgrep/kotlin.yaml .semgrep/kotlin.kt
          semgrep --test --metrics=off --config .semgrep/rust.yaml .semgrep/rust.rs
      - name: Scan the code
        run: semgrep scan --error --metrics=off --config .semgrep/kotlin.yaml --config .semgrep/rust.yaml .

  tools:
    name: Build-tool tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Manifest checker and freeze-guard tests
        run: python3 -m unittest discover -s tools -p "test_*.py"
      - name: Frozen tests unchanged (tests/FROZEN.sha256)
        run: python3 tools/frozen_tests.py check

  vectors:
    name: Reference implementation and test vectors
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned, hash-checked dependencies (in a venv, PEP 668)
        working-directory: tools/vectorref
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Published vectors, reproducibility, label use, round trips
        working-directory: tools/vectorref
        run: python -m unittest -v
      - name: Committed vectors match a fresh generation
        working-directory: tools/vectorref
        run: |
          python generate.py
          git diff --exit-code -- ../../tests/vectors/
