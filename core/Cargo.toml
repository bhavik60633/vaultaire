[workspace]
resolver = "3"
members = ["vault-core"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
rust-version = "1.98"

# Every dependency needs an ADR (docs/adr/ADR-003 to ADR-008) before it is added here.
[workspace.dependencies]
chacha20poly1305 = "=0.11.0"
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc"] }
hkdf = "=0.13.0"
hmac = "=0.13.0"
sha2 = "=0.11.0"
subtle = "=2.6.1"
zeroize = { version = "=1.9.0", features = ["derive"] }
getrandom = "=0.4.3"
minicbor = { version = "=2.3.0", features = ["alloc"] }
unicode-normalization = "=0.1.25"
thiserror = "=2.0.21"
# Dev-only: reading the JSON test vectors (docs/adr/README.md, dev dependencies).
serde_json = "=1.0.151"
hex = "=0.4.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
