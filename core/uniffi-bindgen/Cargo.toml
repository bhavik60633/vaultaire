[package]
name = "uniffi-bindgen"
version = "0.1.0"
description = "Generates the Kotlin bindings for vault-ffi. Build tool only: never part of the app (ADR-008)"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }

[lints.rust]
unsafe_code = "forbid"
