# Secret scanning (gitleaks). Runs before publishing and in CI.
# Default rules, plus two narrow allowlists: exact fictional sample strings, and the generated test
# vectors. Never allowlist a rule or a broad pattern.

[extend]
useDefault = true

[[allowlists]]
description = "Fictional sample data in the UI prototype (prototype/app.js): not real credentials"
regexTarget = "secret"
regexes = [
  '''^pay_live_9fK2mQ7xR4vT1nB8wZ3cY6hJ$''',
  '''^tidal-cobalt-meadow-41$''',
]

[[allowlists]]
# Safe to exempt only because CI fails if this directory holds any file or byte that the generator
# did not produce (tools/vectorref/test_vectorref.py, class Reproducible).
description = "Synthetic test vectors from fixed public seeds (tools/vectorref/generate.py) or published RFCs"
paths = [
  '''^tests/vectors/v1/[a-z0-9-]+\.json$''',
  '''^tests/vectors/v1/kat/[a-z0-9-]+\.json$''',
]
